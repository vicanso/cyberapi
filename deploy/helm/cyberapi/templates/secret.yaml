{{- $store := and .Values.store.url (not .Values.store.existingSecret) -}}
{{- $setup := and .Values.setupToken.value (not .Values.setupToken.existingSecret) -}}
{{- if or $store $setup }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cyberapi.secretName" . }}
  labels:
    {{- include "cyberapi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $store }}
  store-url: {{ .Values.store.url | quote }}
  {{- end }}
  {{- if $setup }}
  setup-token: {{ .Values.setupToken.value | quote }}
  {{- end }}
{{- end }}
