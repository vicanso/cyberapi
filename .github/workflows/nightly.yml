# The default branch, packaged every night (package.yml) into the `nightly`
# prerelease, replaced each time: its tag moves to the commit built and its
# assets are that build's, with their SHA256SUMS. The browser build's image
# is pushed as `nightly` too (docker.yml). A night with nothing new on the
# branch builds nothing; a manual run with `force` builds anyway, and may
# name another branch (`gh workflow run nightly.yml --ref <branch>`). The
# builds are versioned as a pre-release of the next patch, with the day and
# the commit (scripts/nightly-version.sh, #54).
name: Nightly

on:
  schedule:
    - cron: "0 18 * * *" # 02:00 in China
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the branch has not moved since the last nightly
        type: boolean
        default: false

permissions:
  contents: read

# A newer nightly replaces one still building.
concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  changes:
    name: anything new?
    runs-on: ubuntu-24.04
    # The tag is created here. contents: read cannot do that.
    permissions:
      contents: write
    outputs:
      build: ${{ steps.compare.outputs.build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: version
        id: version
        run: echo "version=$(scripts/nightly-version.sh)" >> "$GITHUB_OUTPUT"
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          built=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          if [ "$FORCE" = true ] || [ "$built" != "$GITHUB_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            # Packaging takes long enough for the branch to move. GITHUB_TOKEN
            # can create the nightly tag only while this commit is still the
            # branch head; `gh release create --target` afterwards returns 403
            # (Resource not accessible by integration). Point the tag here, and
            # only attach the release once the packages exist. The previous
            # release is removed only after the new tag exists, so a refusal
            # leaves the current nightly in place. A failed package leaves the
            # tag moved and no nightly release.
            if [ "$built" != "$GITHUB_SHA" ]; then
              src="nightly-src-$GITHUB_SHA"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$src" >/dev/null 2>&1 || true
              if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$src" \
                -f sha="$GITHUB_SHA" >/dev/null; then
                echo "could not point a tag at $GITHUB_SHA" >&2
                echo "GITHUB_TOKEN can create that tag only while this commit is still the branch head." >&2
                exit 1
              fi
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" >/dev/null 2>&1 || true
              if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref=refs/tags/nightly \
                -f sha="$GITHUB_SHA" >/dev/null; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$src" >/dev/null 2>&1 || true
                if [ -n "$built" ]; then
                  gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                    -f ref=refs/tags/nightly \
                    -f sha="$built" >/dev/null 2>&1 || true
                fi
                echo "could not point the nightly tag at $GITHUB_SHA" >&2
                exit 1
              fi
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$src" >/dev/null 2>&1 || true
            fi
            gh release delete nightly --yes 2>/dev/null || true
          else
            echo "the nightly is $GITHUB_SHA already"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.changes.outputs.version }}
    # The macOS signing secrets, when set (package.yml).
    secrets: inherit

  docker:
    # The `nightly` image (docker.yml), pushed from main only.
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.changes.outputs.version }}
    # The Docker Hub credentials (docker.yml).
    secrets: inherit

  publish:
    name: replace the nightly release
    needs: [changes, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: checksums
        # SHA256SUMS beside the packages (scripts/checksums.sh); no
        # latest.json, which says a version, and this is no release of one.
        env:
          # What the packages are named for.
          CYBERAPI_VERSION: ${{ needs.changes.outputs.version }}
        run: scripts/checksums.sh dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          notes="Version $VERSION, built from $GITHUB_REF_NAME at $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M') UTC.

          A development build, replaced every night. The macOS app is signed and
          notarized; the Windows and Linux packages are not signed."
          # The tag was created before packaging. Do not pass --target: that
          # would try to create it again, and 403 once the branch has moved.
          have=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha)
          if [ "$have" != "$GITHUB_SHA" ]; then
            echo "the nightly tag is $have, this build is $GITHUB_SHA" >&2
            exit 1
          fi
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly dist/* \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Nightly $(date -u +%Y-%m-%d) (${GITHUB_SHA::7})" \
            --notes "$notes"
