# The browser build's image on Docker Hub (./Dockerfile): `cyberapi-bridge`
# with the page compiled in, for linux/amd64 and linux/arm64, each built on a
# runner of its own architecture and then joined under one tag. Called by
# release.yml for a version tag (the version and `latest`) and nightly.yml on
# main (`nightly`), with `secrets: inherit`:
#   DOCKER_HUB_USERNAME       the account that pushes
#   DOCKER_HUB_ACCESS_TOKEN   its access token, read & write
# Without them, or off main and off a tag, the image is built and not
# pushed: a manual run (`gh workflow run docker.yml --ref <branch>`) is the
# cheap way to try the Dockerfile from any branch.
name: Docker

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Not the desktop app, hence not plain `cyberapi`; the same name as the
  # bridge's tarball.
  IMAGE_NAME: vicanso/cyberapi-web

jobs:
  image:
    name: image (${{ matrix.platform.tag }})
    # The Dockerfile compiles the page with fat LTO and then the bridge; an
    # hour is generous, and a hung build must not hold a runner for six.
    timeout-minutes: 120
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: linux/amd64, tag: amd64, runs-on: ubuntu-24.04 }
          - { arch: linux/arm64, tag: arm64, runs-on: ubuntu-24.04-arm }
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      push: ${{ steps.plan.outputs.push }}
    steps:
      - name: free disk space
        # Two toolchains, the GUI's dependency graph for wasm and a release
        # build of the bridge: more than a stock runner's free disk.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
      - name: swap
        # Fat LTO over one codegen unit links the whole page in one go; the
        # peak is what kills a 16 GB runner, not the average.
        run: |
          sudo fallocate -l 16G /swapfile-docker
          sudo chmod 600 /swapfile-docker
          sudo mkswap /swapfile-docker
          sudo swapon /swapfile-docker
          free -h
          df -h /
      - uses: actions/checkout@v7
      - name: plan
        # Which tag this run publishes under, and whether it publishes at all.
        id: plan
        env:
          HAS_DOCKER_HUB: ${{ secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_ACCESS_TOKEN != '' }}
        run: |
          channel=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel="${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            channel="nightly"
          fi
          push=false
          if [ -n "$channel" ]; then
            if [ "$HAS_DOCKER_HUB" = "true" ]; then
              push=true
            else
              echo "::warning::DOCKER_HUB_USERNAME / DOCKER_HUB_ACCESS_TOKEN are not set — building the image without pushing it"
            fi
          fi
          echo "channel=${channel:-dry-run}" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "channel: ${channel:-<none, dry run>}  push: $push"
      - uses: docker/setup-buildx-action@v4
      - name: sign in to Docker Hub
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: build and push
        id: build
        uses: docker/build-push-action@v7
        env:
          # No build record kept as an artifact: it is of no use here, and
          # the run's artifacts are what the releases take their files from.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform.arch }}
          # Per architecture and per channel, so a nightly and a release
          # running at the same time never overwrite each other's halves.
          tags: ${{ env.IMAGE_NAME }}:${{ steps.plan.outputs.channel }}-${{ matrix.platform.tag }}
          push: ${{ steps.plan.outputs.push == 'true' }}
          # Without the attestation each push is a plain image, which is what
          # `imagetools create` joins below; with it each push is already a
          # manifest list, and the joined tag lists "unknown/unknown" entries.
          provenance: false
          # No `cache-from` / `cache-to` on purpose: the layer that costs the
          # time is the compile, which every source change invalidates, and
          # storing it would evict the packages' Rust caches from the
          # repository's cache quota.
      - name: digest
        run: echo "${{ steps.build.outputs.digest }}"

  manifest:
    name: one tag for both architectures
    # So that `docker pull` picks the right one.
    needs: image
    if: needs.image.outputs.push == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: join and push
        env:
          CHANNEL: ${{ needs.image.outputs.channel }}
        run: |
          # A release is also `latest`, unless it is a prerelease
          # (`v1.2.0-beta.1`); the nightly is only ever `nightly`.
          tags=(-t "$IMAGE_NAME:$CHANNEL")
          if [ "$CHANNEL" != nightly ] && [[ "$CHANNEL" != *-* ]]; then
            tags+=(-t "$IMAGE_NAME:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE_NAME:$CHANNEL-amd64" \
            "$IMAGE_NAME:$CHANNEL-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:$CHANNEL"
