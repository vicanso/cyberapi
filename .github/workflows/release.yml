# The packages (package.yml) attached to the release a version tag makes,
# with their SHA256SUMS and latest.json (scripts/checksums.sh) and the
# version's CHANGELOG.md section as its text (scripts/release-notes.sh), and
# the browser build's image pushed to Docker Hub (docker.yml). A manual run
# builds the packages and keeps them as its artifacts only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    # The macOS signing secrets, when set (package.yml).
    secrets: inherit

  docker:
    # The version's image and `latest` (docker.yml), beside the packages.
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/docker.yml
    # The Docker Hub credentials (docker.yml).
    secrets: inherit

  release:
    name: attach to the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: checksums
        # SHA256SUMS and latest.json beside the packages, in place of each
        # one's own .sha256 (scripts/checksums.sh).
        run: scripts/checksums.sh dist "$GITHUB_REF_NAME"
      - name: notes
        # The release's text, which the desktop's update dialog shows.
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
