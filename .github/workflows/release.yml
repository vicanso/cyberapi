# The packages (package.yml) attached to the release a version tag makes, and
# the browser build's image pushed to Docker Hub (docker.yml). A manual run
# builds the packages and keeps them as its artifacts only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    # The macOS signing secrets, when set (package.yml).
    secrets: inherit

  docker:
    # The version's image and `latest` (docker.yml), beside the packages.
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/docker.yml
    # The Docker Hub credentials (docker.yml).
    secrets: inherit

  release:
    name: attach to the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
