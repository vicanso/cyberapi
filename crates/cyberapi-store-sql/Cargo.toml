[package]
name = "cyberapi-store-sql"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The bridge's store: CyberAPI's data for many accounts in PostgreSQL or MySQL."
publish = false

[features]
# `conformance::Probe` for this store, for the shared suite.
conformance = ["cyberapi-store/conformance"]

# Server only: the bridge links this crate, the GUI never does.
[dependencies]
chrono = { workspace = true, features = ["clock"] }
cyberapi-core = { workspace = true }
cyberapi-store = { workspace = true }
# An invitation's token (`docs/server-sync.md` §5).
getrandom = "0.4.3"
serde = { workspace = true }
serde_json = { workspace = true }
# A cookie's key: its domain, path and name, hashed to fit an index.
sha2 = { workspace = true }
sqlx = { workspace = true }
# Hashing a password is slow on purpose: it runs on a blocking thread.
tokio = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
cyberapi-store-sql = { workspace = true, features = ["conformance"] }
# A token's hash, as the bridge takes it.
sha2 = { workspace = true }
# Ages an invitation past its end, which no store call does.
sqlx = { workspace = true }
tokio = { workspace = true }
ulid = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
