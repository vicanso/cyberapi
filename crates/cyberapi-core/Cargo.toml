[package]
name = "cyberapi-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CyberAPI's domain: the data model and the pure rules over it, with no I/O."
publish = false

# Everything here builds for wasm32-unknown-unknown: the browser build links
# this crate through the GUI. No gpui, no I/O, no clock.
[dependencies]
base64 = { workspace = true }
jiff = { workspace = true }
imagesize = { workspace = true }
hmac = { workspace = true }
jsonpath-rust = { workspace = true }
jsonschema = { workspace = true }
jsonwebtoken = { workspace = true }
md-5 = { workspace = true }
mime_guess = { workspace = true }
percent-encoding = { workspace = true }
pinyin = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true }
prost-types = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }
snafu = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# jsonwebtoken 10's rust_crypto backend pulls in getrandom 0.2 (via rand 0.8 / rsa / p256);
# enable its `js` feature so signing randomness works on wasm32.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[build-dependencies]
jiff = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
