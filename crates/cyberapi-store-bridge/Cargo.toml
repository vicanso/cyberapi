[package]
name = "cyberapi-store-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The store over the bridge: the wire protocol, the server's dispatch, and the browser's BridgeStore."
publish = false

# Both sides of the wire: the bridge dispatches calls with it, and the
# browser build makes them — so it builds for wasm, and knows no HTTP
# client: the page hands it one (`Transport`).
[dependencies]
cyberapi-core = { workspace = true }
cyberapi-http = { workspace = true }
cyberapi-store = { workspace = true }
# An event stream's answer, read as the bridge streams it.
futures = { workspace = true }
# Gzip for a large body posted to the bridge. Pure Rust, so the page can
# use it too. The bridge accepts zstd as well; this side does not encode it.
flate2 = "1.1.10"
serde = { workspace = true }
serde_json = { workspace = true }
web-time = "1.1.0"

[lints.clippy]
unwrap_used = "deny"
