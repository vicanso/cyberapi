[package]
name = "cyberapi-store-turso"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The desktop's store: CyberAPI's data in a turso (SQLite-format) file, compatible with the Tauri app's database."
publish = false

[features]
# `conformance::Probe` for this store, for the shared suite.
conformance = ["cyberapi-store/conformance"]

# Desktop only: the GUI asks for this crate in its native dependency table,
# and the browser build never compiles it.
[dependencies]
async-lock = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
cyberapi-core = { workspace = true }
cyberapi-store = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# What opening a file had to repair (`schema::repair_old_environments`).
tracing = { workspace = true }
turso = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
cyberapi-store-turso = { workspace = true, features = ["conformance"] }
pollster = { workspace = true }
tempfile = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
