[package]
name = "cyberapi-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CyberAPI's use cases over the store and engine traits: sending a request, backing up."
publish = false

# Only traits below this crate, so it builds for wasm32 as well: the browser
# build runs the same pipeline, with the bridge's store and engine.
[dependencies]
# The local offset for the `now` template function: in a page the browser's
# (`wasmbind`).
chrono = { workspace = true, features = ["clock"] }
cyberapi-core = { workspace = true }
cyberapi-http = { workspace = true }
cyberapi-store = { workspace = true }
# E1: a WebSocket's two ways.
futures = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
web-time = "1.1.0"
zip = { workspace = true }
# The seed of a send's random template values (`uuid`, `random`): the
# browser's crypto in a page (`wasm_js`).
getrandom = "0.4.3"

[target.'cfg(target_family = "wasm")'.dependencies]
chrono = { workspace = true, features = ["clock", "wasmbind"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
pollster = { workspace = true }
pretty_assertions = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
