[package]
name = "cyberapi-http"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CyberAPI's HTTP engine: the trait every build sends through, and the native engine behind it."
publish = false

# The trait and the target policy build for wasm32 (the browser build sends
# through the bridge); the engine is native only.
[dependencies]
cyberapi-core = { workspace = true }
# The signal that stops a watched event stream.
futures = { workspace = true }
ipnet = "2.12.2"
serde = { workspace = true }
snafu = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# A proxy's Basic sign-in (#60).
base64 = { workspace = true }
brotli-decompressor = "6.1.0"
bytes = "1.12.1"
flate2 = "1.1.10"
http = "1.5.0"
http-body-util = "0.1.5"
# `server`: a project's mock server (G2).
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
# A client certificate kept as a `.p12` / `.pfx` (C5).
p12-keystore = "0.4.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
# zstd bodies, decoded in Rust: no C library to build for every target.
ruzstd = "0.9.1"
# `io-util`: talking to a proxy (#60).
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# E1: the WebSocket protocol over the connection the engine upgrades itself.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tracing = { workspace = true }
url = { workspace = true }
webpki-roots = "1.0.10"

[dev-dependencies]
# E1: the test's WebSocket server.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
# zstd bodies for the test server to send.
ruzstd = "0.9.1"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
pretty_assertions = { workspace = true }
# A certificate no root vouches for, made for the test's own HTTPS server.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }

[lints.clippy]
unwrap_used = "deny"
