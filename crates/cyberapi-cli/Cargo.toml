[package]
name = "cyberapi-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CyberAPI without its window: a project file's APIs run from a terminal or CI, as Run… runs them."
publish = false

# A native program over the same core, service and engine as the desktop;
# never the GUI crate. The project is held in memory: no database, no
# server.
[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cyberapi-core = { workspace = true }
cyberapi-http = { workspace = true }
cyberapi-service = { workspace = true }
cyberapi-store = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

[lints.clippy]
unwrap_used = "deny"
