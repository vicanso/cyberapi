[package]
name = "cyberapi-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The browser build of CyberAPI."
# Not published: it ships as a bundle of wasm and JavaScript, not a crate.
publish = false

[lib]
# `cdylib` is what wasm-bindgen consumes; `rlib` keeps a native
# `cargo check --workspace` able to build it (as an empty crate).
crate-type = ["cdylib", "rlib"]

# Everything is the browser's: a native build of this crate is empty.
[target.'cfg(target_family = "wasm")'.dependencies]
# The application itself, as a library. No `version`: this crate is never
# published.
cyberapi-gui = { path = ".." }
cyberapi-core = { workspace = true }
cyberapi-store-bridge = { workspace = true }
# The channel the icon watcher sleeps on, and reading a response body.
futures = { workspace = true }
gpui-kit = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `tracing` has nowhere to go in a page without a writer for the console.
tracing-subscriber = { workspace = true }
tracing-web = "0.1.3"
wasm-bindgen = "0.2.104"
# A reload when the bridge says the login has lapsed, so the page asks for it
# again.
web-sys = { version = "0.3.105", features = ["Window", "Location"] }
