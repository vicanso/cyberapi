[package]
name = "cyberapi-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A fast, native HTTP API client built with Rust and GPUI."
keywords = ["http", "api", "rest", "gpui", "gui"]
categories = ["development-tools"]
readme = "README.md"

[lib]
# The application as a library, so the browser build (`cyberapi-web`) can
# reach the views. A `[[bin]]`-only crate cannot be depended on.
name = "cyberapi_gui"
path = "src/lib.rs"

[[bin]]
name = "cyberapi"
path = "src/main.rs"

[workspace]
members = ["crates/*", "cyberapi-bridge", "cyberapi-web"]
# A bare `cargo build` builds the desktop binary only. `cyberapi-web` is built
# from its own directory, where its `rust-toolchain.toml` selects the nightly
# its wasm target needs.
default-members = ["."]

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
repository = "https://github.com/vicanso/cyberapi"

[workspace.dependencies]
# One dependency for the UI: gpui-kit re-exports GPUI (`gpui_kit::*`), the
# platform (`gpui_kit::platform`, and `gpui_kit::web` on wasm), the component
# library (`gpui_kit::component`) and its icons (`gpui_kit::assets`). It pins
# the `gpui-pre-*` family itself, so there is no second version to keep in step.
gpui-kit = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The in-tree crates. `crates/*` compile for wasm as well as natively.
cyberapi-core = { path = "crates/cyberapi-core" }
cyberapi-store = { path = "crates/cyberapi-store" }
cyberapi-store-turso = { path = "crates/cyberapi-store-turso" }
cyberapi-store-sql = { path = "crates/cyberapi-store-sql" }
cyberapi-store-bridge = { path = "crates/cyberapi-store-bridge" }
cyberapi-http = { path = "crates/cyberapi-http" }
cyberapi-service = { path = "crates/cyberapi-service" }
async-lock = "3.4.2"
base64 = "0.23.1"
# Parsing and formatting only: what "now" is comes from the caller, so no
# `clock` feature and nothing that needs a wasm time source.
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
# Toneless readings with every heteronym, for matching names by pinyin (F15.1).
pinyin = { version = "0.11.0", default-features = false, features = ["plain", "heteronym"] }
directories = "6.0.0"
futures = "0.3.34"
md-5 = "0.11.0"
mime_guess = "2.0.5"
# An image's width and height from its header, for the response panel (F7.4).
imagesize = { version = "0.15.0", default-features = false, features = ["bmp", "gif", "heif", "ico", "jpeg", "png", "pnm", "tiff", "webp"] }
percent-encoding = "2.3.2"
# gRPC (unary calls): a message encoded and decoded with the definitions an
# API keeps, read from a server's reflection or compiled from .proto files.
prost = "0.14.4"
prost-types = "0.14.4"
prost-reflect = { version = "0.16.5", features = ["serde"] }
# .proto files compiled in-process, without protoc: the desktop's import.
protox = "0.10.0"
pollster = "1.0.1"
pretty_assertions = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
# Objects keep their keys in the order written: a formatted body and a shown
# response read as they were sent.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
rust-i18n = "4.2.4"
snafu = "0.9.2"
# The bridge's store: one `Any` code path over PostgreSQL and MySQL, chosen
# by the URL at run time (`docs/architecture.md` §4.4). `mysql-rsa` lets a
# password reach MySQL 8's default authentication without TLS.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "any",
    "postgres",
    "mysql",
    "mysql-rsa",
    "migrate",
    "macros",
] }
sys-locale = "0.3.2"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
toml = "1.1.8"
# The desktop's database: an in-process engine that reads and writes the
# SQLite format, so the Tauri app's `my_db.db` opens as it is. Without the
# default features, which install mimalloc as the process's global allocator.
turso = { version = "0.8.3", default-features = false }
url = "2.5.8"
# The desktop's backups (M13): the old app's zip of JSON tables, deflated.
# Pure Rust zlib, and none of the other methods.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Record ids. In a page `generate` reads the browser's clock and, with
# getrandom's `wasm_js` (`cyberapi-store`), its crypto.
ulid = "3.0.0"

# A crate in plain `[dependencies]` must build for `wasm32-unknown-unknown`;
# a native-only one goes in the desktop table below.
[dependencies]
# Puts a workspace's changes in a queue (`states::run_serial`).
async-lock = { workspace = true }
# "Now", for showing times relative to it. `wasmbind` is what lets the
# browser build read the clock; the desktop ignores it.
chrono = { workspace = true, features = ["clock", "wasmbind"] }
cyberapi-core = { workspace = true }
cyberapi-http = { workspace = true }
cyberapi-service = { workspace = true }
cyberapi-store = { workspace = true }
# The desktop signs in to one bridge and calls it (`states::server`).
cyberapi-store-bridge = { workspace = true }
# A server project's working copy tells its workspace each write it took
# (`states::copy`).
futures = { workspace = true }
gpui-kit = { workspace = true }
# The code editors' completion items, for the template hints
# (`views::template_hints`); the version gpui-base's own completion takes.
lsp-types = "0.97.0"
# Shared with gpui-component (same major), so one `set_locale` translates both
# the app's strings and the components' own.
rust-i18n = { workspace = true }
# The pin list on this machine (`pins_local`).
serde = { workspace = true }
# A form body is stored as its fields' JSON (4.3).
serde_json = { workspace = true }
tracing = { workspace = true }
# The clock of a request in flight, on both targets.
web-time = "1.1.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cyberapi-store-turso = { workspace = true }
directories = { workspace = true }
# JSON and HTML highlighting in the body editors (HTML's grammar takes XML
# too; there is none of XML's own). Asked for here only: on wasm,
# gpui-component drops the grammars but still compiles the features' code.
# And GPUI Fast as the desktop's engine (`gpui-fast`): gpui-kit then
# re-exports Fast as `gpui_kit::*` and hands out its platform, so no import
# changes. The browser build keeps the default engine, whose web platform
# `cyberapi-web` builds by name; this table is not read for wasm.
gpui-kit = { workspace = true, features = ["tree-sitter", "tree-sitter-html", "gpui-fast"] }
# GraphQL's grammar for the GraphQL body's query, registered with highlights
# of our own (`src/syntax.rs`): gpui-kit's `tree-sitter-graphql` feature
# brings the grammar with an empty highlight query.
tree-sitter = "0.26.13"
tree-sitter-graphql = "0.1.0"
# A gRPC call's definitions from .proto files the reader picks.
protox = { workspace = true }
# The OS version, for the about section and the User-Agent (F1.7, F5.4).
os_info = { version = "3.15.0", default-features = false }
# Blocks on the store's first answers before the first window opens.
pollster = { workspace = true }
sys-locale = { workspace = true }
# The terminal logger. A tab logs to the browser console (`cyberapi-web`).
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# The runtime the HTTP engine sends on; gpui's executor is not tokio.
tokio = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# A file the page saves is a download the browser makes (`this_build`).
js-sys = "0.3.106"
# `get_locale()` reads `navigator.languages` only behind this feature.
sys-locale = { workspace = true, features = ["js"] }
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Location",
    "Navigator",
    "Storage",
    "Url",
    "Window",
] }

[dev-dependencies]
# `TestAppContext` and `#[gpui_kit::test]` for the states' tests.
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
# The locale files are compared key by key.
toml = { workspace = true }

# The Windows executable's icon, compiled in by build.rs; a build for any
# other target does nothing with it.
[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[lints.clippy]
unwrap_used = "deny"

# The desktop package (`make desktop-dist`, cargo-bundle): the Tauri app's
# name and identifier, so installing it is an upgrade that takes the old
# app's place (/Applications/CyberAPI.app). Its data stays where it was; this
# app copies it once (`src/paths.rs`). The windows are titled `APP_NAME`.
[package.metadata.bundle]
name = "CyberAPI"
identifier = "com.bigtree.cyberapi"
icon = [
    "resources/icons/32x32.png",
    "resources/icons/128x128.png",
    "resources/icons/128x128@2x.png",
    "resources/icons/icon.icns",
    "resources/icons/icon.ico",
]
category = "public.app-category.developer-tools"
short_description = "A fast, native HTTP API client"
copyright = "Copyright © 2022-2026 Tree Xie"
osx_minimum_system_version = "11.0"
deb_depends = ["libxkbcommon0", "libwayland-client0", "libvulkan1"]

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

# The browser bundle's iteration build (`make web-bundle`): thin LTO over 16
# units for build time, `opt-level = "s"` for download size, and the name
# section kept so a panic's stack in the console shows Rust function names.
[profile.web]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = "s"
strip = "none"

# The shipped browser bundle (`make web-release`): the release profile with
# `opt-level = "s"` throughout; `wasm-opt -Oz` runs after it in the script.
[profile.web-release]
inherits = "release"
opt-level = "s"
