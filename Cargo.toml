[package]
name = "cyberapi-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A fast, native HTTP API client built with Rust and GPUI."
keywords = ["http", "api", "rest", "gpui", "gui"]
categories = ["development-tools"]
readme = "README.md"

[lib]
# The application as a library, so the browser build (`cyberapi-web`) can
# reach the views. A `[[bin]]`-only crate cannot be depended on.
name = "cyberapi_gui"
path = "src/lib.rs"

[[bin]]
name = "cyberapi"
path = "src/main.rs"

[workspace]
members = ["crates/*", "cyberapi-bridge", "cyberapi-web"]
# A bare `cargo build` builds the desktop binary only. `cyberapi-web` is built
# from its own directory, where its `rust-toolchain.toml` selects the nightly
# its wasm target needs.
default-members = ["."]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Tree Xie <tree.xie@outlook.com>"]
license = "Apache-2.0"
repository = "https://github.com/vicanso/cyberapi"

[workspace.dependencies]
# One dependency for the UI: gpui-kit re-exports GPUI (`gpui_kit::*`), the
# platform (`gpui_kit::platform`, and `gpui_kit::web` on wasm), the component
# library (`gpui_kit::component`) and its icons (`gpui_kit::assets`). It pins
# the `gpui-pre-*` family itself, so there is no second version to keep in step.
gpui-kit = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The in-tree crates. `crates/*` compile for wasm as well as natively.
cyberapi-core = { path = "crates/cyberapi-core" }
cyberapi-store = { path = "crates/cyberapi-store" }
cyberapi-store-turso = { path = "crates/cyberapi-store-turso" }
cyberapi-store-sql = { path = "crates/cyberapi-store-sql" }
cyberapi-store-bridge = { path = "crates/cyberapi-store-bridge" }
async-lock = "3.4.2"
# Parsing and formatting only: what "now" is comes from the caller, so no
# `clock` feature and nothing that needs a wasm time source.
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
# Toneless readings with every heteronym, for matching names by pinyin (F15.1).
pinyin = { version = "0.11.0", default-features = false, features = ["plain", "heteronym"] }
directories = "6.0.0"
futures = "0.3.34"
pollster = "1.0.1"
pretty_assertions = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rust-i18n = "4.2.4"
snafu = "0.9.2"
# The bridge's store: one `Any` code path over PostgreSQL and MySQL, chosen
# by the URL at run time (`docs/architecture.md` §4.4). `mysql-rsa` lets a
# password reach MySQL 8's default authentication without TLS.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "any",
    "postgres",
    "mysql",
    "mysql-rsa",
    "migrate",
    "macros",
] }
sys-locale = "0.3.2"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "time"] }
toml = "1.1.8"
# The desktop's database: an in-process engine that reads and writes the
# SQLite format, so the Tauri app's `my_db.db` opens as it is. Without the
# default features, which install mimalloc as the process's global allocator.
turso = { version = "0.8.3", default-features = false }
# Record ids. Native only: `generate` reads the system clock and its RNG,
# neither of which a wasm32 page has.
ulid = "3.0.0"

# A crate in plain `[dependencies]` must build for `wasm32-unknown-unknown`;
# a native-only one goes in the desktop table below.
[dependencies]
# "Now", for showing times relative to it. `wasmbind` is what lets the
# browser build read the clock; the desktop ignores it.
chrono = { workspace = true, features = ["clock", "wasmbind"] }
cyberapi-core = { workspace = true }
cyberapi-store = { workspace = true }
gpui-kit = { workspace = true }
# Shared with gpui-component (same major), so one `set_locale` translates both
# the app's strings and the components' own.
rust-i18n = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cyberapi-store-turso = { workspace = true }
directories = { workspace = true }
# Blocks on the store's first answers before the first window opens.
pollster = { workspace = true }
sys-locale = { workspace = true }
# The terminal logger. A tab logs to the browser console (`cyberapi-web`).
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(target_family = "wasm")'.dependencies]
# `get_locale()` reads `navigator.languages` only behind this feature.
sys-locale = { workspace = true, features = ["js"] }

[dev-dependencies]
# The locale files are compared key by key.
toml = { workspace = true }

[lints.clippy]
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

# The browser bundle's iteration build (`make web-bundle`): thin LTO over 16
# units for build time, `opt-level = "s"` for download size, and the name
# section kept so a panic's stack in the console shows Rust function names.
[profile.web]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = "s"
strip = "none"

# The shipped browser bundle (`make web-release`): the release profile with
# `opt-level = "s"` throughout; `wasm-opt -Oz` runs after it in the script.
[profile.web-release]
inherits = "release"
opt-level = "s"
